[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "mcd-host"
version = "0.1.0"
description = "麦门东道主 · 请客参谋：基于麦当劳中国 MCP 的请客/团餐凑桌、分摊与分享卡片工具"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
authors = [{ name = "jimpablo" }]
keywords = ["mcdonalds", "mcp", "agent", "skill", "group-order"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Topic :: Utilities",
]
dependencies = []

[project.scripts]
mcd-host = "mcd_host.cli:main"

[project.urls]
Homepage = "https://github.com/jimpablo/mcd-host"
Repository = "https://github.com/jimpablo/mcd-host"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
